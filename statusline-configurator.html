<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code Statusline Configurator</title>
  <style>
    :root {
      --color-bg: #161616;
      --color-surface: #1f1f1f;
      --color-surface-2: #2a2a2a;
      --color-border: #333;
      --color-text: #e0e0e0;
      --color-text-muted: #777;
      --color-accent: #7c6af7;
      --color-accent-hover: #9d8fff;
      --color-danger: #f87171;
      --color-success: #4ade80;
      --color-warning: #facc15;
      --font: 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'Cascadia Code', 'Consolas', monospace;
      --radius: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 24px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    header h1 { font-size: 15px; font-weight: 600; }

    header .badge {
      font-size: 10px;
      padding: 2px 7px;
      background: var(--color-accent);
      border-radius: 99px;
      color: #fff;
      font-weight: 600;
    }

    .main-panel {
      display: grid;
      grid-template-columns: 260px 1fr;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    /* ---------- Left panel ---------- */
    .fields-panel {
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .panel-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
      margin-bottom: 10px;
      padding: 0 4px;
    }

    /* ---------- Right panel ---------- */
    .config-panel {
      padding: 16px;
      overflow-y: auto;
    }

    /* ---------- Preview ---------- */
    .preview-section {
      padding: 14px 24px;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    .preview-output {
      font-family: var(--font-mono);
      font-size: 13px;
      background: #000;
      border-radius: var(--radius);
      padding: 10px 16px;
      min-height: 36px;
    }

    /* ---------- Export ---------- */
    .export-section {
      padding: 14px 24px;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .export-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    textarea.export-textarea {
      width: 100%;
      height: 90px;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 8px 12px;
      color: var(--color-text);
      font-family: var(--font-mono);
      font-size: 11px;
      resize: vertical;
    }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      background: var(--color-surface-2);
      color: var(--color-text);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.12s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--color-border); }
    .btn.btn-primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
    .btn.btn-primary:hover { background: var(--color-accent-hover); border-color: var(--color-accent-hover); }
    .btn.btn-danger { border-color: var(--color-danger); color: var(--color-danger); }
    .btn.btn-danger:hover { background: rgba(248,113,113,0.1); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
    .btn-icon {
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      padding: 2px 4px;
      font-size: 13px;
      line-height: 1;
      border-radius: 3px;
    }
    .btn-icon:hover { color: var(--color-text); background: var(--color-surface-2); }
    .sortable-ghost {
      opacity: 0.4;
      background: var(--color-accent) !important;
    }
  </style>
</head>
<body>
  <header>
    <h1>Claude Code Statusline Configurator</h1>
    <span class="badge">v1</span>
  </header>

  <div class="main-panel">
    <aside class="fields-panel">
      <div class="panel-title">Verfügbare Felder</div>
      <div id="fields-tree"></div>
    </aside>

    <main class="config-panel">
      <div class="panel-title">Konfiguration</div>
      <div id="lines-container"></div>
      <button class="btn" id="btn-add-line" onclick="addLine()" style="margin-top:8px;">+ Zeile hinzufügen</button>
    </main>
  </div>

  <section class="preview-section">
    <div class="panel-title" style="margin-bottom:8px;">Vorschau</div>
    <div class="preview-output" id="preview-output" aria-live="polite"></div>
  </section>

  <section class="export-section">
    <div class="panel-title">Export / Import</div>
    <div class="export-actions">
      <button class="btn btn-primary" onclick="downloadConfig()">⬇ Download statusline-config.json</button>
      <button class="btn" onclick="copyConfig()">📋 Kopieren</button>
      <button class="btn" onclick="triggerImport()">📂 Laden</button>
      <input type="file" id="import-input" accept=".json" style="display:none" aria-label="Import config file" onchange="importConfig(event)">
    </div>
    <textarea class="export-textarea" id="export-textarea" readonly placeholder='{"lines": []}' spellcheck="false"></textarea>
  </section>

  <!-- Edit Dialog -->
  <div id="edit-dialog-overlay"
       style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;"
       onclick="closeEditDialog()"></div>
  <div id="edit-dialog"
       style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
              background:var(--color-surface);border:1px solid var(--color-border);
              border-radius:var(--radius);z-index:201;min-width:360px;max-width:440px;
              box-shadow:0 8px 32px rgba(0,0,0,0.4);">
    <div style="padding:14px 20px;border-bottom:1px solid var(--color-border);">
      <div id="edit-dialog-title" style="font-weight:600;font-size:13px;"></div>
    </div>
    <div id="edit-dialog-tabs" style="display:flex;border-bottom:1px solid var(--color-border);">
      <button class="edit-tab-btn" data-tab="general"
              style="flex:1;padding:9px 4px;font-size:12px;border:none;background:none;
                     cursor:pointer;color:var(--color-text);border-bottom:2px solid transparent;"
              onclick="switchEditTab('general')">Allgemein</button>
      <button class="edit-tab-btn" data-tab="datatype"
              style="flex:1;padding:9px 4px;font-size:12px;border:none;background:none;
                     cursor:pointer;color:var(--color-text);border-bottom:2px solid transparent;"
              onclick="switchEditTab('datatype')">Datentyp</button>
      <button class="edit-tab-btn" data-tab="colors"
              style="flex:1;padding:9px 4px;font-size:12px;border:none;background:none;
                     cursor:pointer;color:var(--color-text);border-bottom:2px solid transparent;"
              onclick="switchEditTab('colors')">Farben</button>
    </div>
    <div style="padding:16px 20px;min-height:120px;">
      <div class="edit-tab-content" data-tab="general"  id="edit-tab-general"></div>
      <div class="edit-tab-content" data-tab="datatype" id="edit-tab-datatype" style="display:none;"></div>
      <div class="edit-tab-content" data-tab="colors"   id="edit-tab-colors"   style="display:none;"></div>
    </div>
    <div style="padding:12px 20px;border-top:1px solid var(--color-border);
                display:flex;justify-content:flex-end;gap:8px;">
      <button class="btn" onclick="closeEditDialog()">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveEditDialog()">Speichern</button>
    </div>
  </div>

  <script>
// ─── Constants ────────────────────────────────────────────────────────────

const AVAILABLE_FIELDS = [
  { group: 'Model', items: [
    { key: 'model.display_name', label: 'Display Name' },
    { key: 'model.id',           label: 'Model ID' },
  ]},
  { group: 'Cost', items: [
    { key: 'cost.total_cost_usd',         label: 'Total Cost (USD)' },
    { key: 'cost.total_duration_ms',      label: 'Duration (ms)' },
    { key: 'cost.total_lines_added',      label: 'Lines Added' },
    { key: 'cost.total_lines_removed',    label: 'Lines Removed' },
  ]},
  { group: 'Context Window', items: [
    { key: 'context_window.used_percentage',      label: 'Used %' },
    { key: 'context_window.remaining_percentage', label: 'Remaining %' },
    { key: 'context_window.total_input_tokens',   label: 'Input Tokens' },
    { key: 'context_window.total_output_tokens',  label: 'Output Tokens' },
    { key: 'context_window.context_window_size',  label: 'Window Size' },
  ]},
  { group: 'Rate Limits', items: [
    { key: 'rate_limits.five_hour.used_percentage', label: '5h Used %' },
    { key: 'rate_limits.seven_day.used_percentage', label: '7d Used %' },
  ]},
  { group: 'Workspace', items: [
    { key: 'workspace.current_dir',  label: 'Current Dir' },
    { key: 'workspace.project_dir',  label: 'Project Dir' },
    { key: 'cwd',                    label: 'CWD' },
  ]},
  { group: 'Session', items: [
    { key: 'version',              label: 'Version' },
    { key: 'session_id',           label: 'Session ID' },
    { key: 'agent.name',           label: 'Agent Name' },
    { key: 'vim.mode',             label: 'Vim Mode' },
  ]},
  { group: 'Worktree', items: [
    { key: 'worktree.name',            label: 'Name' },
    { key: 'worktree.branch',          label: 'Branch' },
    { key: 'worktree.original_branch', label: 'Original Branch' },
  ]},
];

// Fields that are percentages (offer progress bar in popup)
const PERCENTAGE_KEYS = new Set([
  'context_window.used_percentage',
  'context_window.remaining_percentage',
  'rate_limits.five_hour.used_percentage',
  'rate_limits.seven_day.used_percentage',
]);

// Default data type for each known field key.
// When a field is dragged from the palette, this mapping is applied automatically.
// The user can override the dataType/format in the Edit Dialog.
const FIELD_TYPE_DEFAULTS = {
  // Model
  'model.display_name':                      { dataType: 'string' },
  'model.id':                                { dataType: 'string' },
  // Cost
  'cost.total_cost_usd':                     { dataType: 'currency' },
  'cost.total_duration_ms':                  { dataType: 'duration',       format: 'short' },
  'cost.total_lines_added':                  { dataType: 'number',         format: 'raw' },
  'cost.total_lines_removed':                { dataType: 'number',         format: 'raw' },
  // Context Window
  'context_window.used_percentage':          { dataType: 'number',         format: 'raw' },
  'context_window.remaining_percentage':     { dataType: 'number',         format: 'raw' },
  'context_window.total_input_tokens':       { dataType: 'number',         format: 'k' },
  'context_window.total_output_tokens':      { dataType: 'number',         format: 'k' },
  'context_window.context_window_size':      { dataType: 'number',         format: 'k' },
  // Rate Limits
  'rate_limits.five_hour.used_percentage':   { dataType: 'number',         format: 'raw' },
  'rate_limits.seven_day.used_percentage':   { dataType: 'number',         format: 'raw' },
  // Workspace / Session
  'workspace.current_dir':                   { dataType: 'string' },
  'workspace.project_dir':                   { dataType: 'string' },
  'cwd':                                     { dataType: 'string' },
  'version':                                 { dataType: 'string' },
  'session_id':                              { dataType: 'string' },
  'agent.name':                              { dataType: 'string' },
  'vim.mode':                                { dataType: 'string' },
  // Worktree
  'worktree.name':                           { dataType: 'string' },
  'worktree.branch':                         { dataType: 'string' },
  'worktree.original_branch':                { dataType: 'string' },
};

// Sample data shown in preview
const SAMPLE_DATA = {
  cwd: '/home/user/myproject',
  session_id: 'abc123def456',
  transcript_path: '/tmp/transcript.jsonl',
  model: { id: 'claude-opus-4-6', display_name: 'Opus' },
  workspace: { current_dir: '/home/user/myproject', project_dir: '/home/user/myproject' },
  version: '1.0.80',
  output_style: { name: 'default' },
  cost: { total_cost_usd: 0.01234, total_duration_ms: 45000, total_api_duration_ms: 2300, total_lines_added: 156, total_lines_removed: 23 },
  context_window: {
    total_input_tokens: 15234, total_output_tokens: 4521, context_window_size: 200000,
    used_percentage: 16, remaining_percentage: 84,
    current_usage: { input_tokens: 8500, output_tokens: 1200, cache_creation_input_tokens: 5000, cache_read_input_tokens: 2000 },
  },
  exceeds_200k_tokens: false,
  rate_limits: {
    five_hour: { used_percentage: 23.5, resets_at: 1738425600 },
    seven_day:  { used_percentage: 41.2, resets_at: 1738857600 },
  },
  vim: { mode: 'NORMAL' },
  agent: { name: '' },
  worktree: { name: '', path: '', branch: '', original_cwd: '', original_branch: 'main' },
};

// ─── ID generation ────────────────────────────────────────────────────────

let _idCounter = 0;
function generateId() { return 'id-' + (++_idCounter); }

// ─── Left panel rendering ─────────────────────────────────────────────────

function renderFieldsPanel() {
  const tree = document.getElementById('fields-tree');
  tree.innerHTML = '';

  for (const group of AVAILABLE_FIELDS) {
    // Group header
    const header = document.createElement('div');
    header.style.cssText = 'font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-muted);padding:8px 4px 4px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;';
    header.innerHTML = `<span class="group-arrow" style="display:inline-block;transition:transform 0.15s;">▶</span> ${group.group}`;

    const itemList = document.createElement('div');
    itemList.className = 'field-group-list';
    itemList.style.cssText = 'display:none;';

    header.addEventListener('click', () => {
      const open = itemList.style.display !== 'none';
      itemList.style.display = open ? 'none' : 'block';
      header.querySelector('.group-arrow').style.transform = open ? '' : 'rotate(90deg)';
    });

    for (const field of group.items) {
      const item = document.createElement('div');
      item.className = 'field-source';
      item.dataset.fieldKey = field.key;
      item.dataset.fieldLabel = field.label;
      item.dataset.fieldGroup = group.group;
      item.style.cssText = 'padding:5px 8px;border-radius:4px;font-size:12px;cursor:grab;display:flex;align-items:center;gap:6px;transition:background 0.1s;';
      item.innerHTML = `
        <span style="color:var(--color-text-muted);font-size:10px;">⠿</span>
        <span>${field.label}</span>
        ${PERCENTAGE_KEYS.has(field.key) ? '<span style="font-size:9px;color:var(--color-accent);margin-left:auto;border:1px solid var(--color-accent);border-radius:3px;padding:1px 4px;">%</span>' : ''}
      `;
      item.addEventListener('mouseenter', () => item.style.background = 'var(--color-surface-2)');
      item.addEventListener('mouseleave', () => item.style.background = '');
      itemList.appendChild(item);
    }

    tree.appendChild(header);
    tree.appendChild(itemList);
  }

  // Diagnose group — virtual fields for diagnostics
  const diagHeader = document.createElement('div');
  diagHeader.style.cssText = 'font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-muted);padding:8px 4px 4px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;';
  diagHeader.innerHTML = '<span class="group-arrow" style="display:inline-block;transition:transform 0.15s;">▶</span> Diagnose';

  const diagList = document.createElement('div');
  diagList.className = 'field-group-list';
  diagList.style.cssText = 'display:none;';

  diagHeader.addEventListener('click', () => {
    const isOpen = diagList.style.display !== 'none';
    diagList.style.display = isOpen ? 'none' : 'block';
    diagHeader.querySelector('.group-arrow').style.transform = isOpen ? '' : 'rotate(90deg)';
  });

  const diagItem = document.createElement('div');
  diagItem.className = 'field-source';
  diagItem.dataset.fieldType = 'new_fields_indicator';
  diagItem.style.cssText = 'padding:5px 8px;border-radius:4px;font-size:12px;cursor:grab;display:flex;align-items:center;gap:6px;transition:background 0.1s;';
  diagItem.innerHTML = `
    <span style="color:var(--color-text-muted);font-size:10px;">⠿</span>
    <span>Neue Felder</span>
    <span style="font-size:9px;color:var(--color-accent);margin-left:auto;border:1px solid var(--color-accent);border-radius:3px;padding:1px 4px;">●</span>
  `;
  diagItem.addEventListener('mouseenter', () => diagItem.style.background = 'var(--color-surface-2)');
  diagItem.addEventListener('mouseleave', () => diagItem.style.background = '');
  diagList.appendChild(diagItem);

  tree.appendChild(diagHeader);
  tree.appendChild(diagList);
}

// Initialize panel immediately
renderFieldsPanel();

/**
 * Renders the "Eigene Felder" (custom fields) group at the bottom of the fields palette.
 * Appends directly to #fields-tree. Replaces previous group if re-rendered.
 */
function renderCustomFieldsGroup() {
  const tree = document.getElementById('fields-tree');

  // Preserve collapse state before removing the existing group
  const existing = document.getElementById('custom-fields-group');
  const wasOpen = existing
    ? existing.querySelector('#custom-fields-list')?.style.display !== 'none'
    : false;
  if (existing) existing.remove();

  const wrapper = document.createElement('div');
  wrapper.id = 'custom-fields-group';

  // Group header (collapsible)
  const header = document.createElement('div');
  header.style.cssText = 'font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-muted);padding:8px 4px 4px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;';
  header.innerHTML = '<span class="group-arrow" style="display:inline-block;transition:transform 0.15s;">▶</span> Eigene Felder';

  const itemList = document.createElement('div');
  itemList.className = 'field-group-list';
  itemList.id = 'custom-fields-list';

  header.addEventListener('click', () => {
    const isOpen = itemList.style.display !== 'none';
    itemList.style.display = isOpen ? 'none' : 'block';
    header.querySelector('.group-arrow').style.transform = isOpen ? '' : 'rotate(90deg)';
  });

  // Render each custom field as a draggable palette entry
  for (const cf of state.customFields) {
    const item = document.createElement('div');
    item.className = 'field-source';
    item.dataset.customFieldId = cf.id;
    item.style.cssText = 'padding:5px 8px;border-radius:4px;font-size:12px;cursor:grab;display:flex;align-items:center;gap:6px;transition:background 0.1s;';
    // Buttons use addEventListener to avoid XSS via injected cf.id values
    item.innerHTML = `
      <span style="color:var(--color-text-muted);font-size:10px;">⠿</span>
      <span style="flex:1;">${escapeHtml(cf.label || cf.text || '?')}</span>
      <button class="btn-icon edit-btn" title="Bearbeiten" style="font-size:11px;">✏️</button>
      <button class="btn-icon del-btn"  title="Löschen"   style="font-size:11px;">🗑️</button>
    `;
    item.querySelector('.edit-btn').addEventListener('click', e => {
      e.stopPropagation();
      openEditDialog('palette', null, cf.id);
    });
    item.querySelector('.del-btn').addEventListener('click', e => {
      e.stopPropagation();
      deleteCustomField(cf.id);
    });
    item.addEventListener('mouseenter', () => item.style.background = 'var(--color-surface-2)');
    item.addEventListener('mouseleave', () => item.style.background = '');
    itemList.appendChild(item);
  }

  // "+ Neues Feld" button at the bottom of the group
  const addBtn = document.createElement('button');
  addBtn.className = 'btn';
  addBtn.style.cssText = 'width:100%;margin-top:4px;font-size:11px;padding:4px 8px;';
  addBtn.textContent = '+ Neues Feld';
  addBtn.onclick = () => openEditDialog('palette-new', null, null);
  itemList.appendChild(addBtn);

  wrapper.appendChild(header);
  wrapper.appendChild(itemList);
  tree.appendChild(wrapper);

  // Restore collapse state after the wrapper is in the DOM
  itemList.style.display = wasOpen ? 'block' : 'none';
  wrapper.querySelector('.group-arrow').style.transform = wasOpen ? 'rotate(90deg)' : '';
}

/**
 * Deletes a custom field from state.customFields by its id.
 * Already-placed copies in lines are not affected (they are independent static fields).
 */
function deleteCustomField(cfId) {
  state.customFields = state.customFields.filter(f => f.id !== cfId);
  render();
}

// ─── State ────────────────────────────────────────────────────────────────

const state = { lines: [], customFields: [] };

// ─── Line management ──────────────────────────────────────────────────────

function addLine() {
  if (state.lines.length >= 10) return;
  state.lines.push({ id: generateId(), fields: [] });
  render();
}

function removeLine(lineId) {
  state.lines = state.lines.filter(l => l.id !== lineId);
  render();
}

// ─── Field management ─────────────────────────────────────────────────────

function addFieldToLine(lineId, fieldObj) {
  const line = state.lines.find(l => l.id === lineId);
  if (!line) return;
  line.fields.push(fieldObj);
  render();
}

function removeFieldFromLine(lineId, fieldId) {
  const line = state.lines.find(l => l.id === lineId);
  if (!line) return;
  line.fields = line.fields.filter(f => f.id !== fieldId);
  render();
}

// ─── Main render ──────────────────────────────────────────────────────────

function render() {
  renderLines();
  renderPreview();
  updateExportTextarea();
  document.getElementById('btn-add-line').disabled = state.lines.length >= 10;
  renderCustomFieldsGroup();
  initSortable(); // must run after all palette DOM (incl. custom-fields-list) is built
}

function renderLines() {
  const container = document.getElementById('lines-container');
  container.innerHTML = '';

  state.lines.forEach((line, lineIndex) => {
    const lineEl = document.createElement('div');
    lineEl.style.cssText = 'margin-bottom:12px;';
    lineEl.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <span style="font-size:11px;color:var(--color-text-muted);">Zeile ${lineIndex + 1}</span>
        <button class="btn btn-danger" style="padding:2px 8px;font-size:11px;" onclick="removeLine('${line.id}')">✕ Entfernen</button>
      </div>
      <div class="line-drop-zone" data-line-id="${line.id}"
           style="min-height:44px;background:var(--color-surface);border:1.5px dashed var(--color-border);
                  border-radius:var(--radius);padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
        ${line.fields.length === 0
          ? '<span style="color:var(--color-text-muted);font-size:12px;pointer-events:none;">Felder hier hineinziehen…</span>'
          : line.fields.map(f => renderFieldChip(f, line.id)).join('')
        }
      </div>
    `;
    container.appendChild(lineEl);
  });

}

function renderFieldChip(field, lineId) {
  const bg = field.bg ? `background:${field.bg};` : '';
  const fg = field.fg ? `color:${field.fg};` : '';
  const label = fieldLabel(field);
  return `
    <span class="field-chip" data-field-id="${field.id}" data-line-id="${lineId}"
          style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;
                 border-radius:4px;font-size:12px;background:var(--color-surface-2);
                 border:1px solid var(--color-border);${bg}${fg}cursor:default;">
      <span>${label}</span>
      <button class="btn-icon" title="Bearbeiten" onclick="openEditDialog('line','${lineId}','${field.id}')">✏️</button>
      <button class="btn-icon" title="Entfernen" onclick="removeFieldFromLine('${lineId}','${field.id}')">✕</button>
    </span>
  `;
}

function fieldLabel(field) {
  if (field.type === 'static')              return `"${escapeHtml(field.text)}"`;
  if (field.type === 'new_fields_indicator') return '● Neue Felder';
  if (field.type === 'field' || field.type === 'progressbar') {
    // Find label in AVAILABLE_FIELDS
    for (const g of AVAILABLE_FIELDS) {
      const found = g.items.find(i => i.key === field.key);
      if (found) return found.label;
    }
    return field.key;
  }
  return '?';
}

// ─── Stubs — replaced in later tasks ─────────────────────────────────────
// ─── Drag & Drop (Sortable.js) ────────────────────────────────────────────

function initSortable() {
  // Destroy old per-group Sortable instances
  document.querySelectorAll('.field-group-list').forEach(list => {
    if (list._sortable) { list._sortable.destroy(); list._sortable = null; }
  });

  // Create one Sortable per group list — field-source items are direct children there
  document.querySelectorAll('.field-group-list').forEach(list => {
    list._sortable = Sortable.create(list, {
      group: { name: 'fields', pull: 'clone', put: false },
      sort: false,
      animation: 100,
      ghostClass: 'sortable-ghost',
      draggable: '.field-source',
      onStart() {
        document.querySelectorAll('.line-drop-zone').forEach(z => {
          z.style.borderColor = 'var(--color-accent)';
        });
      },
      onEnd() {
        document.querySelectorAll('.line-drop-zone').forEach(z => {
          z.style.borderColor = '';
        });
      },
    });
  });

  document.querySelectorAll('.line-drop-zone').forEach(zone => {
    const lineId = zone.dataset.lineId;
    if (zone._sortable) zone._sortable.destroy();
    zone._sortable = Sortable.create(zone, {
      group: { name: 'fields', pull: true, put: true },
      animation: 150,
      ghostClass: 'sortable-ghost',
      draggable: '.field-chip',
      onAdd(evt) {
        const panelFieldType     = evt.item?.dataset?.fieldType;
        const panelCustomFieldId = evt.item?.dataset?.customFieldId;
        const panelFieldKey      = evt.item?.dataset?.fieldKey;
        evt.item.remove();
        let newField;
        if (panelFieldType === 'new_fields_indicator') {
          // Diagnose palette item
          newField = { id: generateId(), type: 'new_fields_indicator', fg: null, bg: null };
          _draggedField = null;
        } else if (panelCustomFieldId) {
          // Custom-field clone from "Eigene Felder" palette → independent static copy
          const cf = state.customFields.find(f => f.id === panelCustomFieldId);
          if (!cf) return;
          newField = { id: generateId(), type: 'static', text: cf.text, fg: cf.fg, bg: cf.bg };
          _draggedField = null;
        } else if (panelFieldKey) {
          // Left-panel known field clone → apply FIELD_TYPE_DEFAULTS automatically
          const isPercentage = PERCENTAGE_KEYS.has(panelFieldKey);
          const defaults = FIELD_TYPE_DEFAULTS[panelFieldKey] || {};
          newField = isPercentage
            ? { id: generateId(), type: 'progressbar', key: panelFieldKey, progressStyle: 'color-coded', fg: null, bg: null }
            : { id: generateId(), type: 'field', key: panelFieldKey, ...defaults, fg: null, bg: null };
          _draggedField = null;
        } else {
          // Zone-to-zone chip move → use the field buffered by onRemove
          newField = _draggedField;
          _draggedField = null;
          if (!newField) return;
        }
        const line = state.lines.find(l => l.id === lineId);
        if (!line) return;
        const safeIndex = Math.min(evt.newIndex, line.fields.length);
        line.fields.splice(safeIndex, 0, newField);
        render();
      },
      onUpdate(evt) {
        const zone = evt.to;
        const chips = [...zone.querySelectorAll('.field-chip')];
        const newOrder = chips.map(c => c.dataset.fieldId);
        const line = state.lines.find(l => l.id === lineId);
        if (!line) return;
        line.fields = newOrder.map(id => line.fields.find(f => f.id === id)).filter(Boolean);
        updateExportTextarea();
        renderPreview();
      },
      onRemove(evt) {
        const fieldId = evt.item.dataset.fieldId;
        const line = state.lines.find(l => l.id === lineId);
        if (!line) return;
        _draggedField = line.fields.find(f => f.id === fieldId) || null;
        line.fields = line.fields.filter(f => f.id !== fieldId);
      },
    });
  });
}
function renderPreview() {
  const out = document.getElementById('preview-output');
  if (state.lines.length === 0) {
    out.innerHTML = '<span style="color:var(--color-text-muted);">Keine Zeilen konfiguriert.</span>';
    return;
  }

  const lines = state.lines.map(line => {
    if (line.fields.length === 0) {
      return '<span style="color:var(--color-text-muted);">(leere Zeile)</span>';
    }
    return line.fields.map(f => renderFieldHtml(f, SAMPLE_DATA)).join('');
  });

  out.innerHTML = lines.join('<br>');
}
// ─── Export ───────────────────────────────────────────────────────────────

function buildExportJson() {
  const lines = state.lines.map(line => ({
    fields: line.fields.map(f => {
      const base = { type: f.type };
      if (f.key)           base.key = f.key;
      if (f.text != null)  base.text = f.text;
      if (f.fg)            base.fg = f.fg;
      if (f.bg)            base.bg = f.bg;
      if (f.progressStyle && f.type === 'progressbar') base.progressStyle = f.progressStyle;
      if (f.dataType)      base.dataType = f.dataType;
      if (f.format)        base.format = f.format;
      if (f.formatOptions) base.formatOptions = f.formatOptions;
      return base;
    }),
  }));

  const customFields = state.customFields.map(cf => ({
    id: cf.id, label: cf.label, text: cf.text,
    fg: cf.fg || null, bg: cf.bg || null,
  }));

  // All keys from AVAILABLE_FIELDS — used by PS for new_fields_indicator
  const knownKeys = AVAILABLE_FIELDS.flatMap(g => g.items.map(i => i.key));

  return JSON.stringify({ lines, customFields, knownKeys }, null, 2);
}

function updateExportTextarea() {
  document.getElementById('export-textarea').value = buildExportJson();
}

function downloadConfig() {
  const json = buildExportJson();
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: 'statusline-config.json' });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function copyConfig() {
  const json = buildExportJson();
  navigator.clipboard.writeText(json).then(() => {
    const btn = document.querySelector('.export-actions .btn:nth-child(2)');
    const orig = btn.textContent;
    btn.textContent = '✓ Kopiert';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

// ─── Import ───────────────────────────────────────────────────────────────

function triggerImport() {
  document.getElementById('import-input').click();
}

function importConfig(event) {
  const file = event.target.files[0];
  if (!file) return;

  const hasContent = state.lines.some(l => l.fields.length > 0);
  if (hasContent && !confirm('Die aktuelle Konfiguration wird überschrieben. Fortfahren?')) {
    event.target.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const json = JSON.parse(e.target.result);
      loadConfig(json);
    } catch {
      alert('Ungültige JSON-Datei.');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function loadConfig(json) {
  if (!json.lines || !Array.isArray(json.lines)) {
    alert('Konfigurationsformat ungültig: "lines" Array fehlt.');
    return;
  }

  state.lines = json.lines.map(line => ({
    id:     generateId(),
    fields: (line.fields || []).map(f => ({
      id:            generateId(),
      type:          f.type          || 'field',
      key:           f.key           || null,
      text:          f.text          || '',
      fg:            f.fg            || null,
      bg:            f.bg            || null,
      progressStyle: f.progressStyle || 'color-coded',
      dataType:      f.dataType      || null,
      format:        f.format        || null,
      formatOptions: f.formatOptions || null,
    })),
  }));

  state.customFields = (json.customFields || []).map(cf => ({
    id:    cf.id    || generateId(),
    label: cf.label || '',
    text:  cf.text  || '',
    fg:    cf.fg    || null,
    bg:    cf.bg    || null,
  }));

  // knownKeys: not stored in state — rebuilt on every export from AVAILABLE_FIELDS

  render();
}

// Bootstrap: one empty line on load
addLine();

// ─── Edit Dialog ─────────────────────────────────────────────────────────

let _draggedField = null; // buffer for zone-to-zone chip drag

let _editCtx = null;   // { source: 'line'|'palette'|'palette-new', lineId, fieldId }
let _editDraft = null; // deep copy of the field being edited

function openEditDialog(source, lineId, fieldId) {
  let field;
  if (source === 'line') {
    const line = state.lines.find(l => l.id === lineId);
    if (!line) return;
    field = line.fields.find(f => f.id === fieldId);
    if (!field) return;
  } else if (source === 'palette') {
    field = state.customFields.find(f => f.id === fieldId);
    if (!field) return;
  } else if (source === 'palette-new') {
    // Creating a new custom field — static text field with a blank template
    field = { id: generateId(), type: 'static', label: '', text: '', fg: null, bg: null };
  }

  _editCtx   = { source, lineId, fieldId: field.id };
  _editDraft = structuredClone(field);

  const title = source === 'palette-new'
    ? 'Neues Feld'
    : source === 'palette'
      ? `Palette: ${field.label || field.text || '?'}`
      : `Feld: ${fieldLabel(field)}`;
  document.getElementById('edit-dialog-title').textContent = title;

  // Show/hide Datentyp tab — only for line fields of type 'field'
  const isDatatypeVisible = source === 'line' && field.type === 'field';
  document.querySelector('.edit-tab-btn[data-tab="datatype"]').style.display =
    isDatatypeVisible ? '' : 'none';

  switchEditTab('general');
  document.getElementById('edit-dialog-overlay').style.display = '';
  document.getElementById('edit-dialog').style.display = '';
}

function closeEditDialog() {
  document.getElementById('edit-dialog-overlay').style.display = 'none';
  document.getElementById('edit-dialog').style.display = 'none';
  _editCtx   = null;
  _editDraft = null;
}

function switchEditTab(tab) {
  document.querySelectorAll('.edit-tab-btn').forEach(btn => {
    const active = btn.dataset.tab === tab;
    btn.style.borderBottomColor = active ? 'var(--color-accent)' : 'transparent';
    btn.style.color = active ? 'var(--color-accent)' : 'var(--color-text)';
  });
  document.querySelectorAll('.edit-tab-content').forEach(content => {
    content.style.display = content.dataset.tab === tab ? '' : 'none';
  });

  // Render the tab content when switching
  if (tab === 'general')       renderEditTabGeneral();
  else if (tab === 'datatype') renderEditTabDatatype();
  else if (tab === 'colors')   renderEditTabColors();
}

function renderEditTabGeneral() {
  const el = document.getElementById('edit-tab-general');
  const f  = _editDraft;
  if (!f) return;

  // Palette sources (edit or create custom fields) always show label + text inputs
  if (_editCtx.source === 'palette' || _editCtx.source === 'palette-new') {
    el.innerHTML = `
      <div style="margin-bottom:10px;">
        <div style="font-size:11px;color:var(--color-text-muted);margin-bottom:4px;">Name in der Palette</div>
        <input id="edit-label" type="text" value="${escapeHtml(f.label || '')}"
               style="width:100%;box-sizing:border-box;padding:6px 8px;border-radius:4px;
                      border:1px solid var(--color-border);background:var(--color-surface-2);
                      color:var(--color-text);font-size:12px;">
      </div>
      <div>
        <div style="font-size:11px;color:var(--color-text-muted);margin-bottom:4px;">Text</div>
        <input id="edit-text" type="text" value="${escapeHtml(f.text || '')}"
               style="width:100%;box-sizing:border-box;padding:6px 8px;border-radius:4px;
                      border:1px solid var(--color-border);background:var(--color-surface-2);
                      color:var(--color-text);font-size:12px;">
      </div>
    `;
  } else if (f.type === 'static') {
    // Line-placed static field — text only, no label input
    el.innerHTML = `
      <div>
        <div style="font-size:11px;color:var(--color-text-muted);margin-bottom:4px;">Text</div>
        <input id="edit-text" type="text" value="${escapeHtml(f.text || '')}"
               style="width:100%;box-sizing:border-box;padding:6px 8px;border-radius:4px;
                      border:1px solid var(--color-border);background:var(--color-surface-2);
                      color:var(--color-text);font-size:12px;">
      </div>
    `;
  } else if (f.type === 'progressbar') {
    const styles = [
      ['block',       '[▓▓▓▓░░░░] 23%',  'Block'],
      ['slim',        '████░░░░ 23%',    'Slim'],
      ['color-coded', '[▓▓▓░░░░░] 23%',  'Farbkodiert (grün/gelb/rot)'],
      ['raw',         '23',              'Rohwert (nur Zahl)'],
    ];
    el.innerHTML = `
      <div style="font-size:11px;color:var(--color-text-muted);margin-bottom:8px;">Progress Bar Stil</div>
      ${styles.map(([val, ex, lbl]) => `
        <label style="display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px;cursor:pointer;">
          <input type="radio" name="edit-pb-style" value="${val}"
                 ${(f.progressStyle || 'color-coded') === val ? 'checked' : ''}>

        Beispielausgabe: <code>● 3 neue Felder</code>
      </p>

  } else {

// Format options per data type — used in renderEditTabDatatype
const DATATYPE_FORMATS = {
  string:         [],
  currency:       [],
  bool:           [['true_false','true / false'],['yes_no','yes / no'],['checkmark','✓ / ✗'],['custom','Benutzerdefiniert']],
  number:         [['raw','Rohwert (12345678)'],['k','Tausend (12346k)'],['m','Millionen (12m)']],
  unix_timestamp: [['hours','Stunden (75h 32m)'],['short','Kurz (1d 4h 32m)'],['long','Lang (1d 4hr 32min)'],['raw','Rohwert']],
  duration:       [['hours','Stunden (75h 32m)'],['short','Kurz (1d 4h 32m)'],['long','Lang (1d 4hr 32min)']],
};

function renderEditTabDatatype() {
  const el = document.getElementById('edit-tab-datatype');
  const f  = _editDraft;
  if (!f) return;

  const currentType   = f.dataType || 'string';
  const currentFormat = f.format   || '';
  const formats       = DATATYPE_FORMATS[currentType] || [];

  el.innerHTML = `
    <div style="margin-bottom:12px;">
      <div style="font-size:11px;color:var(--color-text-muted);margin-bottom:4px;">Datentyp</div>
      <select id="edit-datatype"
              style="width:100%;padding:6px 8px;border-radius:4px;border:1px solid var(--color-border);
                     background:var(--color-surface-2);color:var(--color-text);font-size:12px;">
        ${Object.keys(DATATYPE_FORMATS).map(t =>
          `<option value="${t}" ${t === currentType ? 'selected' : ''}>${t}</option>`
        ).join('')}
      </select>
    </div>
    <div id="edit-format-section">
      ${renderFormatOptions(formats, currentFormat, currentType)}
    </div>
  `;

  document.getElementById('edit-datatype').addEventListener('change', (e) => {
    const newType    = e.target.value;

    document.getElementById('edit-format-section').innerHTML =
      renderFormatOptions(newFormats, '', newType);
    if (newType === 'bool') wireBoolCustomLabels();
  });

  if (currentType === 'bool') wireBoolCustomLabels();
}

// Renders the format radio-button options for a given data type.
// Returns an HTML string — caller sets it via innerHTML.
function renderFormatOptions(formats, currentFormat, dataType) {
  if (formats.length === 0) {
    return '<div style="font-size:12px;color:var(--color-text-muted);">Keine Format-Optionen verfügbar.</div>';
  }
  const opts = formats.map(([val, lbl]) => `
    <label style="display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:5px;cursor:pointer;">
      <input type="radio" name="edit-format" value="${val}"
             ${(!currentFormat && formats[0][0] === val) || currentFormat === val ? 'checked' : ''}>
      <span>${lbl}</span>
    </label>
  `).join('');

  const customSection = dataType === 'bool' ? `
    <div id="edit-custom-labels" style="display:none;margin-top:8px;padding-left:20px;">
      <div style="margin-bottom:6px;">
        <div style="font-size:11px;color:var(--color-text-muted);margin-bottom:3px;">True-Label</div>
        <input id="edit-true-label" type="text"
               value="${escapeHtml(_editDraft?.formatOptions?.trueLabel || '')}"
               style="width:100%;box-sizing:border-box;padding:5px 8px;border-radius:4px;
                      border:1px solid var(--color-border);background:var(--color-surface-2);
                      color:var(--color-text);font-size:12px;">
      </div>
      <div>
        <div style="font-size:11px;color:var(--color-text-muted);margin-bottom:3px;">False-Label</div>
        <input id="edit-false-label" type="text"
               value="${escapeHtml(_editDraft?.formatOptions?.falseLabel || '')}"
               style="width:100%;box-sizing:border-box;padding:5px 8px;border-radius:4px;
                      border:1px solid var(--color-border);background:var(--color-surface-2);
                      color:var(--color-text);font-size:12px;">
      </div>
    </div>
  ` : '';

  return `
    <div style="font-size:11px;color:var(--color-text-muted);margin-bottom:6px;">Format</div>
    ${opts}
    ${customSection}
  `;
}

// Wires show/hide of bool custom-label inputs.
// Must be called AFTER innerHTML is set (script tags inside innerHTML don't execute).
function wireBoolCustomLabels() {
  function toggle() {
    const checked = document.querySelector('[name="edit-format"]:checked');
    const sec = document.getElementById('edit-custom-labels');
    if (sec) sec.style.display = checked?.value === 'custom' ? '' : 'none';
  }
  document.querySelectorAll('[name="edit-format"]').forEach(r => r.addEventListener('change', toggle));
  toggle();
}

function renderEditTabColors() {
  const el = document.getElementById('edit-tab-colors');
  const f  = _editDraft;
  if (!f) return;

  const fg = f.fg || '';
  const bg = f.bg || '';

  el.innerHTML = `
    <div style="margin-bottom:12px;">
      <div style="font-size:11px;color:var(--color-text-muted);margin-bottom:6px;">Vordergrundfarbe</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="color" id="edit-fg" value="${fg || '#e0e0e0'}" style="cursor:pointer;">
        <label style="font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;">
          <input type="checkbox" id="edit-fg-none" ${!fg ? 'checked' : ''}> Keine Farbe
        </label>
      </div>
    </div>
    <div>
      <div style="font-size:11px;color:var(--color-text-muted);margin-bottom:6px;">Hintergrundfarbe</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="color" id="edit-bg" value="${bg || '#333333'}" style="cursor:pointer;">
        <label style="font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;">
          <input type="checkbox" id="edit-bg-none" ${!bg ? 'checked' : ''}> Keine Farbe
        </label>
      </div>
    </div>
  `;
}

function saveEditDialog() {
  if (!_editCtx || !_editDraft) return;
  const { source, lineId } = _editCtx;

  // Read Allgemein tab values into draft
  const labelEl  = document.getElementById('edit-label');
  const textEl   = document.getElementById('edit-text');
  const pbRadio  = document.querySelector('[name="edit-pb-style"]:checked');
  if (labelEl) _editDraft.label = labelEl.value;
  if (textEl)  _editDraft.text  = textEl.value;
  if (pbRadio) _editDraft.progressStyle = pbRadio.value;

  // Read Datentyp tab values into draft (only when tab is visible)
  const typeEl = document.getElementById('edit-datatype');
  if (typeEl) {
    _editDraft.dataType = typeEl.value;
    const fmtRadio = document.querySelector('[name="edit-format"]:checked');
    _editDraft.format = fmtRadio ? fmtRadio.value : null;
    if (_editDraft.dataType === 'bool' && _editDraft.format === 'custom') {
      _editDraft.formatOptions = {
        trueLabel:  document.getElementById('edit-true-label')?.value  || '',
        falseLabel: document.getElementById('edit-false-label')?.value || '',
      };
    } else {
      _editDraft.formatOptions = null;
    }
  }

  // Read Farben tab values into draft — only if the tab was actually rendered.
  // If the user never switched to the Colors tab, the DOM elements don't exist and
  // _editDraft retains the fg/bg values copied at dialog-open time.
  const fgNoneEl = document.getElementById('edit-fg-none');
  if (fgNoneEl !== null) {
    _editDraft.fg = fgNoneEl.checked ? null : (document.getElementById('edit-fg')?.value || null);
    _editDraft.bg = document.getElementById('edit-bg-none')?.checked
      ? null
      : (document.getElementById('edit-bg')?.value || null);
  }

  // Apply draft to actual state
  if (source === 'line') {
    const line = state.lines.find(l => l.id === lineId);
    if (!line) { closeEditDialog(); return; }
    const idx = line.fields.findIndex(f => f.id === _editDraft.id);
    if (idx !== -1) Object.assign(line.fields[idx], _editDraft);
  } else if (source === 'palette') {
    const idx = state.customFields.findIndex(f => f.id === _editDraft.id);
    if (idx !== -1) Object.assign(state.customFields[idx], _editDraft);
  } else if (source === 'palette-new') {
    state.customFields.push(_editDraft);
  }

  closeEditDialog();
  render();
}

// ─── Progress bar rendering ───────────────────────────────────────────────

// Color thresholds (global, matches PowerShell script)
const PB_COLORS = { low: '#4ade80', mid: '#facc15', high: '#f87171' };

/**
 * Returns { bar: string, color: string } for a progress bar.
 * @param {number} value   - 0 to 100
 * @param {string} style   - 'block' | 'slim' | 'color-coded'
 * @param {string|null} fg - override color (#rrggbb) or null
 */
function makeProgressBar(value, style, fg) {
  const pct = Math.min(100, Math.max(0, value || 0));
  const filled = Math.round(pct / 10);   // 10 segments
  const empty  = 10 - filled;

  const thresholdColor = pct < 50 ? PB_COLORS.low : pct < 80 ? PB_COLORS.mid : PB_COLORS.high;
  const color = fg ?? (style === 'color-coded' ? thresholdColor : null);

  let bar;
  if (style === 'slim') {
    bar = '█'.repeat(filled) + '░'.repeat(empty) + ' ' + Math.round(pct) + '%';
  } else {
    // 'block' and 'color-coded' use the same bracket format
    bar = '[' + '▓'.repeat(filled) + '░'.repeat(empty) + '] ' + Math.round(pct) + '%';
  }

  return { bar, color };
}

/**
 * Formats a raw value according to dataType/format/formatOptions — mirrors PS Format-FieldValue.
 * @param {*}      value         - raw value from sample data
 * @param {string} dataType      - 'string'|'currency'|'number'|'bool'|'duration'|'unix_timestamp'
 * @param {string|null} format   - type-specific format string
 * @param {object|null} formatOptions - extra options (e.g. trueLabel/falseLabel for bool/custom)
 * @returns {string}
 */
function formatFieldValue(value, dataType, format, formatOptions) {
  switch (dataType) {
    case 'currency': {
      const n = parseFloat(value);
      return isNaN(n) ? String(value) : n.toFixed(2);
    }
    case 'number': {
      const n = parseFloat(value);
      if (isNaN(n)) return String(value);
      if (format === 'k') return Math.round(n / 1000) + 'k';
      if (format === 'm') return Math.round(n / 1000000) + 'm';
      return String(Math.round(n)); // 'raw'
    }
    case 'bool': {
      const b = value === true || value === 'true' || value === 1 || value === '1';
      switch (format) {
        case 'yes_no':    return b ? 'yes' : 'no';
        case 'checkmark': return b ? '✓' : '✗';
        case 'custom':    return b
          ? (formatOptions?.trueLabel  || 'true')
          : (formatOptions?.falseLabel || 'false');
        default:          return b ? 'true' : 'false'; // true_false
      }
    }
    case 'unix_timestamp': {
      const now  = Math.floor(Date.now() / 1000);
      const diff = Math.max(0, Number(value) - now);
      const h = Math.floor(diff / 3600);
      const m = Math.floor((diff % 3600) / 60);
      return `${h}h ${m}m`;
    }
    case 'duration': {
      const secs = Math.max(0, Math.floor(Number(value)));
      const d = Math.floor(secs / 86400);
      const h = Math.floor((secs % 86400) / 3600);
      const m = Math.floor((secs % 3600) / 60);
      if (format === 'hours') return `${h}h ${m}m`;
      if (format === 'long')  return `${d}d ${h}h ${m}m ${secs % 60}s`;
      // 'short' — omit leading zero units
      if (d > 0) return `${d}d ${h}h ${m}m`;
      if (h > 0) return `${h}h ${m}m`;
      return `${m}m`;
    }
    default: // 'string' and unknown types
      return String(value);
  }
}

/**
 * Formats a field's value for display in the preview (returns HTML string with inline styles).
 * @param {object} field - field config object from state
 * @param {object} data  - sample data object
 */
function renderFieldHtml(field, data) {
  const fg = field.fg;
  const bg = field.bg;
  const style = [fg ? `color:${fg};` : '', bg ? `background:${bg};padding:1px 3px;border-radius:3px;` : ''].join('');

  if (field.type === 'static') {
    return `<span style="${style}">${escapeHtml(field.text || '')}</span>`;
  }

  if (field.type === 'new_fields_indicator') {
    return `<span style="${style}">● Neue Felder (Indikator)</span>`;
  }

  const raw = getNestedValue(data, field.key);
  if (raw === undefined || raw === null || raw === '') {
    return '';
  }

  if (field.type === 'progressbar') {
    if (field.progressStyle === 'raw') {
      return `<span style="${style}">${escapeHtml(String(raw))}</span>`;
    }
    const { bar, color } = makeProgressBar(raw, field.progressStyle || 'color-coded', fg);
    const colorStyle = color ? `color:${color};` : '';
    const finalStyle = [colorStyle, bg ? `background:${bg};padding:1px 3px;border-radius:3px;` : ''].join('');
    return `<span style="${finalStyle}">${bar}</span>`;
  }

  // type === 'field' — apply dataType formatting if configured
  const formatted = field.dataType
    ? formatFieldValue(raw, field.dataType, field.format, field.formatOptions)
    : String(raw);
  return `<span style="${style}">${escapeHtml(formatted)}</span>`;
}

function getNestedValue(obj, path) {
  if (!path || !obj) return undefined;
  return path.split('.').reduce((cur, key) => (cur != null ? cur[key] : undefined), obj);
}

function escapeHtml(str) {
  return str
    .replace(/&/g,  '&amp;')
    .replace(/</g,  '&lt;')
    .replace(/>/g,  '&gt;')
    .replace(/"/g,  '&quot;')
    .replace(/'/g,  '&#39;');
}
